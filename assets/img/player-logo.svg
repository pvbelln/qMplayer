<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" style="max-width: 100%;">
  <defs>
    
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7df0d4"/>
      <stop offset="100%" stop-color="#79afff"/>
    </linearGradient>
    
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4fe5"/>
      <stop offset="100%" stop-color="#3d2ecc"/>
    </linearGradient>
    
    <filter id="globalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1e355e" flood-opacity="0.22"/>
    </filter>
    
    <filter id="buttonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1a1060" flood-opacity="0.28"/>
    </filter>
    
    <filter id="arrowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1a1060" flood-opacity="0.18"/>
    </filter>
  </defs>
  
  <g filter="url(#globalShadow)">
    <rect x="110" y="110" width="292" height="292" rx="84" fill="url(#bgGradient)"/>
  </g>
  
  <circle cx="256" cy="256" r="106" fill="url(#circleGradient)" filter="url(#buttonShadow)"/>
  
  <path d="M 226 201             C 226 192, 236 186, 244 191             L 309 238             C 316 243, 316 253, 309 258             L 244 305             C 236 310, 226 304, 226 295             Z" fill="#ffffff" filter="url(#arrowShadow)"/>
